<a class="work-card card category-{{ .Params.category | urlize }}" href="{{ with .Params.card_link }}{{ . | relURL }}{{ else }}{{ .RelPermalink }}{{ end }}">{{ with .Params.image }}<div class="work-image"><img src="{{ . | relURL }}" alt="{{ $.Params.image_alt | default $.Title }}" loading="lazy"></div>{{ else }}<div class="work-image image-placeholder"><span>Research image</span></div>{{ end }}<div class="work-body"><span class="category">{{ .Params.category | default "Research" }}</span><h3>{{ .Title }}</h3>{{ with .Params.coauthors }}<p class="meta">With {{ . }}</p>{{ end }}<p>{{ .Description }}</p>{{ with .Params.tags }}<div class="tags">{{ range . }}<span>{{ . }}</span>{{ end }}</div>{{ end }}</div></a>
