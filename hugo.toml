[params]
  role = 'Ph.D. Candidate in Political Science · ETH Zürich'
  description = 'Jana Kissling is a political scientist at ETH Zürich researching transnational identity politics, ethnic violence, and peacebuilding.'
  introduction = '''

Welcome! I am a political scientist focusing on the transnational dynamics of **identity**, **conflict**, and **peacebuilding**.

In my research, I explore the role of **transnational identity** networks in shaping different forms of violence, including ethnic cleansing and election violence. 

Using original **geospatial data**, causal inference, and **mixed-methods** tools, I study how these identities become politicized across borders, when ethnic groups become targets of violence, and how peacebuilding can foster reconciliation between groups divided by conflict. 

My work has been published in [International Peacekeeping](https://doi.org/10.1080/13533312.2022.2134121), is supported by the [Swiss National Science Foundation](https://data.snf.ch/grants/grant/227100), and involves collaborations with the Center for Security Studies (ETH Zurich), and the Weatherhead Center for International Affairs (Harvard University).
'''
